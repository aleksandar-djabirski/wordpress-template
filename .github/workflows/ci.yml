name: CI

# Starter-project CI: a single PHP 8.3 / Node 22 target, no matrix builds.
# This is an agency starter, not a library that needs to prove compatibility
# across a version grid — matrices here would add runner cost without adding
# signal. Bump these two versions in lockstep with composer.json's
# `config.platform.php` / .ddev/config.yaml's `php_version` and this repo's
# `engines.node` when the starter's target versions change.

on:
  push:
    branches:
      - main
      - 'ci-capture/**'
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: >-
          Regenerate Playwright visual baselines (tests/visual/__screenshots__)
          against a fresh DDEV install and upload them as the
          `visual-baselines` artifact. Nothing is committed automatically —
          a maintainer downloads the artifact and commits it. Leave false for
          a normal manual run.
        type: boolean
        default: false
      capture_migration_baselines:
        description: >-
          Capture the IMMUTABLE pre-migration parity baselines
          (tests/parity/__migration_baselines__) against the classic theme and
          upload them as the `migration-baselines` artifact. Run this ONCE,
          against a commit where the classic theme still renders. Nothing is
          committed automatically.
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Static/offline PHP quality gate: composer validate, security audit,
  #    phpcs, phpstan, deptrac, architecture + unit tests. No database, no
  #    WordPress install — this is `composer verify:fast` verbatim, the same
  #    command a contributor runs locally before pushing.
  php-qa:
    name: PHP QA (verify:fast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: composer verify:fast (validate, audit, lint:php, analyse, deptrac, architecture + unit tests)
        run: composer verify:fast

  # 2. Frontend toolchain: JS/CSS lint, wp-scripts build, and a build-drift
  #    check. The block build output under blocks/reference-callout/build/ is
  #    committed to git (see .gitignore's comment) so a fresh clone works
  #    without a build step; this job proves the committed copy still matches
  #    what `npm run build` produces from source right now.
  frontend:
    name: Frontend (lint, build, build-drift check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint (JS + CSS)
        run: npm run lint

      - name: Build block editor assets
        run: npm run build

      - name: Verify committed build output has no drift
        # Stage first, then diff --cached, so the check also catches brand-new
        # build files that `npm run build` emits but git isn't tracking yet
        # (a plain `git diff` ignores untracked files and would miss them).
        run: git add -A -- web/app/themes/site-theme/blocks && git diff --cached --exit-code -- web/app/themes/site-theme/blocks

  # 3. PHP integration suite against a real MariaDB service container.
  #    wp-phpunit installs its own WP test tables against the DB below; env
  #    var names here must match tests/wp-tests-config.php's
  #    agency_starter_integration_env() lookups exactly (WP_TESTS_DB_*).
  integration:
    name: PHP integration (wp-phpunit + MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: db
          MYSQL_PASSWORD: db
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mysqli
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: composer test:integration
        env:
          WP_TESTS_DB_HOST: 127.0.0.1
          WP_TESTS_DB_NAME: wordpress_test
          WP_TESTS_DB_USER: db
          WP_TESTS_DB_PASSWORD: db
        run: composer test:integration

  # 4. Full-stack Playwright suite (e2e + accessibility, plus visual when
  #    baselines exist / are being regenerated) against a real DDEV install.
  #    Runs after php-qa/frontend so a cheap static-analysis failure doesn't
  #    burn the cost of booting a full WordPress stack.
  #
  #    The commerce profile has its own separate `commerce-e2e` job below;
  #    this base e2e job never installs WooCommerce, proving the base
  #    storefront runs (and is tested) without it.
  e2e:
    name: End-to-end (DDEV + Playwright)
    if: github.ref != 'refs/heads/ci-capture/migration-baselines'
    runs-on: ubuntu-24.04
    needs: [php-qa, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Install deterministic parity fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Start DDEV
        run: ddev start

      - name: Create .env for CI
        # .env.example's defaults (WP_ENV=development, the ddev.site WP_HOME,
        # and the db/db/db DB_* credentials) already match this job's DDEV
        # service; the sed calls below make that intent explicit/idempotent
        # rather than relying on the example file never changing. The
        # AUTH_KEY/SALT placeholders ("generateme", identical across all 8
        # constants) are left as-is: WordPress only needs *some* string
        # there, this database is destroyed at the end of the job, and
        # scripts/setup's openssl-based salt generation is a local-dev
        # convenience this CI job doesn't need.
        run: |
          cp .env.example .env
          sed -i 's/^WP_ENV=.*/WP_ENV=development/' .env
          sed -i 's#^WP_HOME=.*#WP_HOME=https://agency-starter.ddev.site#' .env

      - name: Install PHP dependencies (inside DDEV)
        # Retried: WordPress core is fetched from downloads.w.org over HTTP/3,
        # and a dropped QUIC connection makes Composer exit 100 with
        # "curl error 56". That killed five separate runs during the Unit 1
        # verification, each time recovering on an unchanged re-run. The failure
        # is transient and network-side, so retry rather than fail the job.
        run: |
          for attempt in 1 2 3; do
            if ddev composer install --no-interaction --prefer-dist; then
              exit 0
            fi
            echo "::warning::composer install failed (attempt ${attempt}/3) — retrying"
            sleep 15
          done
          echo "::error::composer install failed after 3 attempts"
          exit 1

      - name: Install WordPress core
        # LOCAL/CI-ONLY throwaway credentials — mirrors scripts/setup step 3.
        # Never used against a shared or production environment.
        run: |
          ddev wp core install \
            --url=https://agency-starter.ddev.site \
            --title="Agency Starter CI" \
            --admin_user=admin \
            --admin_password=admin \
            --admin_email=admin@example.invalid \
            --skip-email

      - name: Activate theme and base-profile plugins
        run: |
          ddev wp theme activate site-theme
          ddev wp plugin activate site-core site-integrations

      - name: WP-CLI alias integration suite (real `wp` + installed site)
        # The `wp agency check-overrides` alias test shells out to the real
        # WP-CLI binary against the DDEV dev database, so it can only run in
        # this job — the wp-phpunit-only `integration` CI job has no WP-CLI
        # and no installed site. Runs before the Playwright steps so a CLI
        # registration regression fails fast.
        run: ddev composer test:integration:cli

      - name: Create client-editor test user
        # LOCAL/CI-ONLY throwaway credential — mirrors scripts/setup step 8;
        # tests/e2e/helpers/auth.ts logs in with this exact user/pass.
        run: |
          ddev wp user create client-editor client-editor@example.invalid \
            --role=client_editor \
            --display_name="Client Editor" \
            --user_pass=client-editor

      - name: Create the site navigation menu
        # Mirrors scripts/setup step 9. parts/site-header.html renders a
        # ref-less <!-- wp:navigation /-->, which resolves at render time to the
        # most recently published non-empty wp_navigation record.
        # Seeding one named record makes CI deterministic; it does not depend on
        # no other record existing.
        run: |
          SAMPLE_PAGE_ID="$(ddev wp post list --post_type=page --name=sample-page --field=ID)"
          ddev wp post create \
            --post_type=wp_navigation \
            --post_status=publish \
            --post_title="Primary" \
            --post_content="<!-- wp:navigation-link {\"label\":\"Home\",\"url\":\"https://agency-starter.ddev.site/\",\"kind\":\"custom\",\"isTopLevelLink\":true} /--><!-- wp:navigation-link {\"label\":\"Sample Page\",\"id\":${SAMPLE_PAGE_ID},\"type\":\"page\",\"kind\":\"post-type\",\"url\":\"https://agency-starter.ddev.site/sample-page/\"} /-->"

      - name: Create the Demo page
        # Mirrors scripts/setup step 10; tests/parity and tests/e2e both drive
        # /demo/.
        run: |
          MEDIA_ID="$(ddev wp media import tests/fixtures/demo-media.png --title='Demo media' --porcelain)"
          MEDIA_URL="$(ddev wp eval "echo wp_get_attachment_url( ${MEDIA_ID} );")"
          sed -e "s|{{MEDIA_ID}}|${MEDIA_ID}|g" -e "s|{{MEDIA_URL}}|${MEDIA_URL}|g" tests/fixtures/demo-page.html > /tmp/demo-page.html
          ddev wp post create --post_type=page --post_status=publish --post_title="Demo" --post_name=demo --post_content="$(cat /tmp/demo-page.html)"

      - name: Set pretty permalinks
        # tests/accessibility/smoke.spec.ts and other specs request
        # /sample-page/-style paths, which need a non-default rewrite
        # structure to resolve.
        run: ddev wp rewrite structure '/%postname%/' --hard

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        env:
          WP_BASE_URL: https://agency-starter.ddev.site
        run: npm run test:e2e

      - name: Run accessibility suite
        env:
          WP_BASE_URL: https://agency-starter.ddev.site
        run: npm run test:accessibility

      - name: Check for committed visual baselines
        id: visual_baselines
        run: |
          if [ -d "tests/visual/__screenshots__" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Visual regression has three mutually-exclusive paths, gated on the
      # manual workflow_dispatch input and on whether baselines are already
      # committed:
      #   1. update_visual_snapshots=true or ref ci-capture/visual-baselines
      #      -> (re)generate baselines, upload
      #      as an artifact for a maintainer to download and commit. Never
      #      run on push/pull_request (Windows/macOS-vs-Linux font
      #      rendering makes non-CI-generated baselines untrustworthy, and
      #      generated screenshots must be human-reviewed before landing —
      #      see playwright.config.ts's top-of-file comment).
      #   2. update_visual_snapshots=false (or push/pull_request) AND
      #      baselines exist -> run the visual suite normally as a
      #      regression gate.
      #   3. update_visual_snapshots=false (or push/pull_request) AND no
      #      baselines exist yet -> nothing to compare against; skip with a
      #      notice instead of failing the whole workflow.
      - name: Regenerate visual baselines (manual or ci-capture ref)
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots == true)
          || github.ref == 'refs/heads/ci-capture/visual-baselines'
        env:
          WP_BASE_URL: https://agency-starter.ddev.site
        run: npm run test:visual -- --update-snapshots

      - name: Upload regenerated visual baselines
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots == true)
          || github.ref == 'refs/heads/ci-capture/visual-baselines'
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__
          if-no-files-found: error

      - name: Run visual regression suite
        if: >-
          !((github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots == true)
          || github.ref == 'refs/heads/ci-capture/visual-baselines')
          && steps.visual_baselines.outputs.exists == 'true'
        env:
          WP_BASE_URL: https://agency-starter.ddev.site
        run: npm run test:visual

      - name: Skip visual regression (no committed baselines yet)
        if: >-
          !((github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots == true)
          || github.ref == 'refs/heads/ci-capture/visual-baselines')
          && steps.visual_baselines.outputs.exists == 'false'
        run: |
          echo "::notice::No committed visual baselines at tests/visual/__screenshots__ yet — skipping npm run test:visual. Re-run this workflow manually (workflow_dispatch) with update_visual_snapshots=true to generate them, then download the visual-baselines artifact and commit it."

      - name: Set migration parity site title
        if: >-
          !((github.event_name == 'workflow_dispatch' && inputs.capture_migration_baselines == true)
          || github.ref == 'refs/heads/ci-capture/migration-baselines'
          || github.ref == 'refs/heads/ci-capture/visual-baselines')
        run: ddev wp option update blogname "Agency Starter Baseline Capture"

      - name: Run migration and editing parity suites
        if: >-
          !((github.event_name == 'workflow_dispatch' && inputs.capture_migration_baselines == true)
          || github.ref == 'refs/heads/ci-capture/migration-baselines'
          || github.ref == 'refs/heads/ci-capture/visual-baselines')
        env:
          WP_BASE_URL: https://agency-starter.ddev.site
        run: npm run test:parity -- --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # 5. Commerce profile: the proof the OPTIONAL WooCommerce layer works, kept
  #    entirely separate from the base jobs above so the base profile is always
  #    exercised with no WooCommerce installed. This job boots a base DDEV
  #    install, runs `scripts/enable-commerce` (which `composer require`s
  #    WooCommerce — ephemeral to this runner, never committed), then runs the
  #    commerce PHPUnit suite and the COMMERCE=1 Playwright journeys. Runs after
  #    php-qa/frontend for the same cost reason as the base e2e job.
  commerce-e2e:
    name: 'Commerce (DDEV + WooCommerce: integration + Playwright)'
    if: github.ref != 'refs/heads/ci-capture/migration-baselines'
    runs-on: ubuntu-latest
    needs: [php-qa, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Start DDEV
        run: ddev start

      - name: Create .env for CI
        # Mirrors the base e2e job — the DDEV service defaults already match.
        run: |
          cp .env.example .env
          sed -i 's/^WP_ENV=.*/WP_ENV=development/' .env
          sed -i 's#^WP_HOME=.*#WP_HOME=https://agency-starter.ddev.site#' .env

      - name: Install PHP dependencies (inside DDEV)
        # Retried: WordPress core is fetched from downloads.w.org over HTTP/3,
        # and a dropped QUIC connection makes Composer exit 100 with
        # "curl error 56". That killed five separate runs during the Unit 1
        # verification, each time recovering on an unchanged re-run. The failure
        # is transient and network-side, so retry rather than fail the job.
        run: |
          for attempt in 1 2 3; do
            if ddev composer install --no-interaction --prefer-dist; then
              exit 0
            fi
            echo "::warning::composer install failed (attempt ${attempt}/3) — retrying"
            sleep 15
          done
          echo "::error::composer install failed after 3 attempts"
          exit 1

      - name: Install WordPress core
        # LOCAL/CI-ONLY throwaway credentials — mirrors scripts/setup step 3.
        run: |
          ddev wp core install \
            --url=https://agency-starter.ddev.site \
            --title="Agency Starter Commerce CI" \
            --admin_user=admin \
            --admin_password=admin \
            --admin_email=admin@example.invalid \
            --skip-email

      - name: Activate theme and base-profile plugins
        run: |
          ddev wp theme activate site-theme
          ddev wp plugin activate site-core site-integrations

      - name: Create the site navigation menu
        # Mirrors scripts/setup step 9. parts/site-header.html renders a
        # ref-less <!-- wp:navigation /-->, which resolves at render time to the
        # most recently published non-empty wp_navigation record.
        # Seeding one named record makes CI deterministic; it does not depend on
        # no other record existing.
        run: |
          SAMPLE_PAGE_ID="$(ddev wp post list --post_type=page --name=sample-page --field=ID)"
          ddev wp post create \
            --post_type=wp_navigation \
            --post_status=publish \
            --post_title="Primary" \
            --post_content="<!-- wp:navigation-link {\"label\":\"Home\",\"url\":\"https://agency-starter.ddev.site/\",\"kind\":\"custom\",\"isTopLevelLink\":true} /--><!-- wp:navigation-link {\"label\":\"Sample Page\",\"id\":${SAMPLE_PAGE_ID},\"type\":\"page\",\"kind\":\"post-type\",\"url\":\"https://agency-starter.ddev.site/sample-page/\"} /-->"

      - name: Create the Demo page
        # Mirrors scripts/setup step 10.
        run: |
          MEDIA_ID="$(ddev wp media import tests/fixtures/demo-media.png --title='Demo media' --porcelain)"
          MEDIA_URL="$(ddev wp eval "echo wp_get_attachment_url( ${MEDIA_ID} );")"
          sed -e "s|{{MEDIA_ID}}|${MEDIA_ID}|g" -e "s|{{MEDIA_URL}}|${MEDIA_URL}|g" tests/fixtures/demo-page.html > /tmp/demo-page.html
          ddev wp post create --post_type=page --post_status=publish --post_title="Demo" --post_name=demo --post_content="$(cat /tmp/demo-page.html)"

      - name: Ensure WordPress core uploads directory exists
        # The commerce integration suite (wp-phpunit) scans WP core's default
        # uploads dir (ABSPATH/wp-content/uploads) in WP_UnitTestCase teardown.
        # Bedrock installs core without a wp-content/, so create it up front —
        # the checkout is owned by the runner, so this host mkdir is writable in
        # the DDEV container via the bind mount.
        run: mkdir -p web/wp/wp-content/uploads

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Enable the commerce profile
        # Installs WooCommerce (ephemeral `composer require` on this runner only),
        # activates site-commerce, configures a deterministic store, and creates
        # the fixtures the commerce suites assert against.
        run: bash scripts/enable-commerce

      - name: Commerce integration suite (PHPUnit + WooCommerce + HPOS)
        run: ddev composer test:integration:commerce

      - name: Commerce e2e journeys (Playwright, COMMERCE=1)
        env:
          COMMERCE: '1'
          WP_BASE_URL: https://agency-starter.ddev.site
        run: npm run test:e2e:commerce

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-commerce
          path: playwright-report/
          retention-days: 7

  # 6. One-shot capture of the IMMUTABLE pre-migration parity baselines.
  #    Manual trigger only, and deliberately gated on NOTHING: the baselines
  #    photograph a frontend that stops existing after the block-theme
  #    conversion, so an unrelated red check in php-qa or frontend must never
  #    be able to prevent the capture. Pinned to the same runner image and the
  #    same font package as the e2e job, because a parity baseline is only
  #    comparable against a run with identical font rendering.
  migration-baseline-capture:
    name: Capture migration parity baselines (manual or ci-capture ref)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.capture_migration_baselines == true)
      || github.ref == 'refs/heads/ci-capture/migration-baselines'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Install deterministic parity fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Start DDEV
        run: ddev start

      - name: Create .env for CI
        run: |
          cp .env.example .env
          sed -i 's/^WP_ENV=.*/WP_ENV=development/' .env
          sed -i 's#^WP_HOME=.*#WP_HOME=https://agency-starter.ddev.site#' .env

      - name: Install PHP dependencies (inside DDEV)
        # Retried: WordPress core is fetched from downloads.w.org over HTTP/3,
        # and a dropped QUIC connection makes Composer exit 100 with
        # "curl error 56". That killed five separate runs during the Unit 1
        # verification, each time recovering on an unchanged re-run. The failure
        # is transient and network-side, so retry rather than fail the job.
        run: |
          for attempt in 1 2 3; do
            if ddev composer install --no-interaction --prefer-dist; then
              exit 0
            fi
            echo "::warning::composer install failed (attempt ${attempt}/3) — retrying"
            sleep 15
          done
          echo "::error::composer install failed after 3 attempts"
          exit 1

      - name: Install WordPress core
        run: |
          ddev wp core install \
            --url=https://agency-starter.ddev.site \
            --title="Agency Starter Baseline Capture" \
            --admin_user=admin \
            --admin_password=admin \
            --admin_email=admin@example.invalid \
            --skip-email

      - name: Activate theme and base-profile plugins
        run: |
          ddev wp theme activate site-theme
          ddev wp plugin activate site-core site-integrations

      - name: Seed the site navigation
        run: |
          SAMPLE_PAGE_ID="$(ddev wp post list --post_type=page --name=sample-page --field=ID)"
          ddev wp post create \
            --post_type=wp_navigation \
            --post_status=publish \
            --post_title="Primary" \
            --post_content="<!-- wp:navigation-link {\"label\":\"Home\",\"url\":\"https://agency-starter.ddev.site/\",\"kind\":\"custom\",\"isTopLevelLink\":true} /--><!-- wp:navigation-link {\"label\":\"Sample Page\",\"id\":${SAMPLE_PAGE_ID},\"type\":\"page\",\"kind\":\"post-type\",\"url\":\"https://agency-starter.ddev.site/sample-page/\"} /-->"
          ddev wp rewrite structure '/%postname%/' --hard

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Capture the baselines
        env:
          WP_BASE_URL: https://agency-starter.ddev.site
          CAPTURE_MIGRATION_BASELINE: '1'
        run: npm run capture:migration-baseline

      - name: Record the capture environment
        run: |
          {
            echo "capturedAtCommit=${GITHUB_SHA}"
            echo "capturedAtUtc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "playwrightVersion=$(npx playwright --version)"
            echo "browserVersion=$(node -e 'const { chromium } = require("playwright"); chromium.launch().then(async b => { process.stdout.write(b.version()); await b.close(); })')"
          } > tests/parity/__migration_baselines__/capture-environment.txt
          cat tests/parity/__migration_baselines__/capture-environment.txt

      - name: Upload migration parity baselines
        uses: actions/upload-artifact@v7
        with:
          name: migration-baselines
          path: tests/parity/__migration_baselines__
          if-no-files-found: error
